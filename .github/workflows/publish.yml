name: publish

# Release flow: bump "version" in package.json, commit, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# This builds, tests, and publishes to npm.
# One-time setup: create an npm "Automation" token (bypasses 2FA) at npmjs.com → Access Tokens,
# then add it as the repo secret NPM_TOKEN (Settings → Secrets and variables → Actions).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # enables npm provenance (supply-chain attestation)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != package version $VER"; exit 1; }

      - run: npm ci
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
