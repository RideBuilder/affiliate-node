name: publish

# Release flow: bump "version" in package.json, commit, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Publishes to npm via Trusted Publishing (OIDC) — no stored token, and it's exempt from the
# account's publish-2FA requirement.
# One-time setup: npmjs.com → package @ridebuilder/affiliate → Settings → Trusted Publisher →
#   add a GitHub Actions publisher (owner: RideBuilder, repo: affiliate-node, workflow: publish.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: authenticates to npm AND signs provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs a recent npm; latest npm requires Node 22+/24+.
      - run: npm install -g npm@latest

      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != package version $VER"; exit 1; }

      - run: npm ci
      - run: npm test

      # No NODE_AUTH_TOKEN — npm authenticates via the OIDC trusted publisher.
      - run: npm publish --access public --provenance
